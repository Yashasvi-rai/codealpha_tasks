<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <title>NovaCalc | Modern Calculator</title>
</head>

<body>

    <!-- Animated Background -->
    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="container">

        <!-- Calculator -->
        <div class="calculator">

            <!-- Header -->
            <div class="header">

                <div>
                    <h1>NovaCalc</h1>
                    <p>Fast • Elegant • Accurate</p>
                </div>

                <button id="themeBtn" title="Toggle Theme">
                    🌙
                </button>

            </div>

            <!-- Display -->
            <div class="display-area">

                <div id="expression"></div>

                <input
                    type="text"
                    id="display"
                    placeholder="0"
                    readonly>

            </div>

            <!-- Buttons -->

            <div class="buttons">

                <button class="operator" onclick="clearDisplay()">
                    AC
                </button>

                <button class="operator" onclick="deleteLast()">
                    ⌫
                </button>

                <button class="operator" onclick="appendValue('%')">
                    %
                </button>

                <button class="operator" onclick="appendValue('/')">
                    ÷
                </button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>

                <button class="operator"
                    onclick="appendValue('*')">
                    ×
                </button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>

                <button class="operator"
                    onclick="appendValue('-')">
                    −
                </button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>

                <button class="operator"
                    onclick="appendValue('+')">
                    +
                </button>

                <button class="zero"
                    onclick="appendValue('0')">
                    0
                </button>

                <button onclick="appendValue('.')">
                    .
                </button>

                <button class="equal"
                    onclick="calculate()">
                    =
                </button>

            </div>

        </div>

        <!-- History Panel -->

        <div class="history">

            <div class="history-header">

                <h2>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    History
                </h2>

                <button id="clearHistory">
                    Clear
                </button>

            </div>

            <ul id="historyList">

                <li class="empty">
                    No calculations yet.
                </li>

            </ul>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <p>
            Designed & Developed with ❤️ using
            HTML, CSS & JavaScript
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
